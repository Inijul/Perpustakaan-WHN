version: '3.8'


services:
  db:
    image: mysql:latest
    container_name: perpustakaan-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: perpustakaan-whn
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  backend:
    build: .
    container_name: perpustakaan-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    container_name: perpustakaan-frontend
    ports:
      - "8000:8000"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/var/www
    depends_on:
      - backend
      - db

volumes:
  db_data: